name: Dev Check

on:
  push:
    branches-ignore:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # No VITE_SUPABASE_* env needed — supabase.js falls back to the public
      # project URL/anon key baked in as defaults when these are unset.
      - run: npm run build
