name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$packageVersion") {
            throw "Tag ${{ github.ref_name }} must match package.json version $packageVersion."
          }

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # No VITE_SUPABASE_* env needed — supabase.js falls back to the public
      # project URL/anon key baked in as defaults when these are unset.
      #
      # electron-builder publishes the installer, blockmap, and latest.yml to
      # the GitHub Release directly (--publish always) instead of us relaying
      # the files through a separate CI-artifact-download-then-gh-release
      # step — one tool generates and uploads all three together, so their
      # checksums/filenames can't drift out of sync with each other the way
      # a second, different upload path could.
      - name: Build and publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run dist -- --win nsis --publish always

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest --repo buzzjay84/Leave-Credits-Management-System
